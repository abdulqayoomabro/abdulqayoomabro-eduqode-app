name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugin-tests:
    name: WordPress plugin tests (real WordPress + Tutor LMS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, mbstring, gd
      - name: Lint plugin
        run: for f in $(find wordpress/eduqode-app-connector -name '*.php'); do php -l "$f"; done
      - name: Run end-to-end plugin tests
        run: tests/plugin/setup_and_run.sh "$RUNNER_TEMP/wp"
      - name: EduQode School plugin (teacher, parent, student, attendance, report cards)
        shell: bash
        run: |
          for f in $(find wordpress/eduqode-school -name '*.php'); do php -l "$f"; done
          tests/school/run_school_tests.sh "$RUNNER_TEMP/wp" | tee "$RUNNER_TEMP/wp/school-results.txt"
      - name: Backup and restore between two sites
        shell: bash
        run: tests/backup/run_backup_test.sh "$RUNNER_TEMP/wp" | tee "$RUNNER_TEMP/wp/backup-results.txt"
      - name: Upload plugin test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-test-results
          path: |
            ${{ runner.temp }}/wp/results.txt
            ${{ runner.temp }}/wp/backup-results.txt
            ${{ runner.temp }}/wp/school-results.txt

  e2e:
    name: End-to-end test on an Android emulator (real WordPress + Tutor LMS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, mbstring, gd
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Get ffmpeg (makes a playable test video)
        timeout-minutes: 5
        run: |
          # A ready-made ffmpeg from PyPI (apt mirrors can hang for a long time).
          pip install --quiet imageio-ffmpeg
          echo "FFMPEG=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test WordPress + Tutor LMS site
        run: tests/plugin/setup_and_run.sh "$RUNNER_TEMP/wp"
      - name: Start test site for the emulator
        timeout-minutes: 5
        run: tests/e2e/start_site.sh "$RUNNER_TEMP/wp"
      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c
            gradle connectedAndroidTest -Pe2e --stacktrace || (adb logcat -d -s EduQodeE2E:I TestRunner:* AndroidRuntime:E WM-WorkerWrapper:* | tail -300; exit 1)
            adb logcat -d -s EduQodeE2E:I
      - name: Check the website (Tutor LMS) after the test
        run: |
          WP="php $RUNNER_TEMP/wp/wp-cli.phar --allow-root --path=$RUNNER_TEMP/wp/site"
          IDS=$(cat "$RUNNER_TEMP/wp/site/e2e-ids.json"); echo "$IDS"
          L3=$(echo "$IDS" | python3 -c "import json,sys;print(json.load(sys.stdin)['l3'])")
          C=$(echo "$IDS" | python3 -c "import json,sys;print(json.load(sys.stdin)['course'])")
          U=$(echo "$IDS" | python3 -c "import json,sys;print(json.load(sys.stdin)['student'])")
          DONE=$($WP eval "echo tutor_utils()->is_completed_lesson($L3, $U) ? 'yes' : 'no';")
          ENR=$($WP eval "echo tutor_utils()->is_enrolled($C, $U) ? 'yes' : 'no';")
          PCT=$($WP eval "echo tutor_utils()->get_course_completed_percent($C, $U);")
          echo "Lesson completed offline is completed on the website: $DONE"
          echo "Student still enrolled after removing the download: $ENR"
          echo "Course progress on the website: $PCT%"
          QZ=$(echo "$IDS" | python3 -c "import json,sys;print(json.load(sys.stdin)['quiz'])")
          ATT=$($WP eval "global \$wpdb; \$a=\$wpdb->get_row(\"SELECT COUNT(*) n, MAX(earned_marks) e, MAX(total_marks) t, MAX(result) r FROM {\$wpdb->prefix}tutor_quiz_attempts WHERE quiz_id=$QZ AND user_id=$U\"); printf(\"%d %.1f/%.1f %s\", \$a->n, \$a->e, \$a->t, \$a->r);")
          echo "Offline quiz attempt in Tutor LMS (count, marks, result): $ATT"
          [ "$DONE" = "yes" ] && [ "$ENR" = "yes" ] && [ "$ATT" = "1 4.0/6.0 pass" ]
      - name: Test results
        if: always()
        run: |
          find app/build/outputs/androidTest-results -name '*.xml' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          for tc in r.iter('testcase'):
              failed = tc.find('failure') is not None
              print(('FAIL  ' if failed else 'PASS  ') + tc.get('name'))
              if failed: print('      ' + (tc.find('failure').get('message') or '')[:300])
          PY
          done
          tail -5 "$RUNNER_TEMP/wp/e2e-server.log" || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      # Optional: Play Store upload key from repository secrets (Settings > Secrets > Actions).
      - name: Prepare upload key
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK and release AAB
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: gradle assembleDebug bundleRelease --stacktrace

      - name: Package files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EduQode-test.apk
          cp app/build/outputs/bundle/release/app-release.aab EduQode-release.aab
          (cd wordpress && zip -qr ../eduqode-app-connector.zip eduqode-app-connector)
          (cd wordpress && zip -qr ../eduqode-school.zip eduqode-school)

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: EduQode-build
          path: |
            EduQode-test.apk
            EduQode-release.aab
            eduqode-app-connector.zip
            eduqode-school.zip

      # Publishes the files on the Releases page so they can be downloaded on a phone with one tap.
      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: EduQode test build
          body: |
            Latest test build from the main branch.
            - EduQode-test.apk: install on your phone for testing
            - eduqode-app-connector.zip: WordPress plugin (Plugins > Add New > Upload Plugin)
            - eduqode-school.zip: EduQode School plugin (classes, teacher/parent dashboards, attendance, report cards)
            - EduQode-release.aab: Play Store bundle (signed only when the upload key secrets are set)
          prerelease: true
          make_latest: false
          files: |
            EduQode-test.apk
            EduQode-release.aab
            eduqode-app-connector.zip
            eduqode-school.zip

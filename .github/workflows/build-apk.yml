name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EduQode-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Rename APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk EduQode-test.apk

      # Publishes the APK on the Releases page so it can be downloaded on a phone with one tap.
      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: EduQode test build
          body: Latest test APK, built from the main branch. Download EduQode-test.apk on your phone and install it.
          prerelease: true
          make_latest: false
          files: EduQode-test.apk
